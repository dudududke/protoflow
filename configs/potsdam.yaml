base: base_common.yaml
experiment:
  name: potsdam_protoflow
  output_dir: outputs/potsdam_protoflow

dataset:
  root: data/processed/potsdam
  train_split: train.txt
  val_split: val.txt
  num_classes: 6
  class_names: [impervious_surface, building, low_vegetation, tree, car, clutter]
  use_nir_as_red: true
  augmentation:
    crop_size: 512

protocol:
  type: class_incremental
  label_visibility: cumulative
  steps:
    - [0, 1, 2]
    - [3]
    - [4]
    - [5]

train:
  lr: 0.01
  max_iters: 30000
